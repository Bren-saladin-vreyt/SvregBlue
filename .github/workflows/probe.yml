name: probe
# Prints vanilla 26.2 sources the mod hooks into (run by hand), so code can match them exactly.
on:
  workflow_dispatch:
    inputs:
      pattern:
        description: 'path regex under net/minecraft (e.g. renderer/fog/)'
        required: true
        default: 'renderer/fog/'

jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: decompile minecraft
        run: chmod +x ./gradlew && ./gradlew genSources -q
      - name: extract
        run: |
          SRC=$(find ~/.gradle "$GITHUB_WORKSPACE/.gradle" -name '*sources*.jar' 2>/dev/null | grep -i minecraft | grep -v -i fabric-api | head -1)
          echo "src: $SRC"
          mkdir -p src2 probe
          unzip -o -q "$SRC" 'net/minecraft/*' -d src2
          find src2/net/minecraft -name '*.java' | grep -E "${{ github.event.inputs.pattern }}" | sort > probe/files.txt
          cat probe/files.txt
          : > probe/all.txt
          for f in $(cat probe/files.txt); do echo "===== ${f#src2/}" >> probe/all.txt; grep -v -E '^\s*(import |$|//)' "$f" >> probe/all.txt; done
          wc -c probe/all.txt
      - name: publish to the probe branch (readable with plain git)
        run: |
          cd probe
          git init -q -b probe
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "probe $GITHUB_RUN_ID"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
