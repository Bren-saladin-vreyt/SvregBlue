name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build
        shell: bash
        run: |
          chmod +x ./gradlew
          set +e
          for i in 1 2 3 4; do ./gradlew help -q && break; echo 'dependency download failed, retrying'; sleep 20; done
          ./gradlew build --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E -A4 'error:|What went wrong|Caused by|FAILURE' build.log | head -120 > err.txt
            split -b 3500 err.txt errpart.
            for part in errpart.*; do
              body=$(python3 -c "import sys;d=open(sys.argv[1]).read();print(d.replace('%','%25').replace('\r','').replace('\n','%0A'))" "$part")
              echo "::error title=build-$part::$body"
            done
            exit 1
          fi
      - name: upload jar
        uses: actions/upload-artifact@v7
        with:
          name: SvregBlue-jar
          path: build/libs/*.jar
      - name: publish as the 'latest' release (easy download from a phone)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          gh release delete latest -y --cleanup-tag || true
          gh release create latest "$JAR" --title "SvregBlue (latest build)" --notes "Built from ${GITHUB_SHA::7}. Put the .jar in your mods folder next to SvregSky (Fabric, Minecraft 26.2). Needs Fabric API." --prerelease
